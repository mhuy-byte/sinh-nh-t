<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Galaxy - YÊU</title>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020106;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Màn hình Hộp Quà Ban Đầu */
        #gift-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #150526 0%, #020106 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .gift-box-wrapper {
            text-align: center;
            cursor: pointer;
            animation: bounceGift 2s infinite ease-in-out;
        }

        .gift-icon {
            font-size: 90px;
            filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.8));
            transition: transform 0.3s ease;
        }

        .gift-box-wrapper:hover .gift-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .gift-text {
            margin-top: 20px;
            font-size: 18px;
            color: #ffb3d9;
            text-shadow: 0 0 10px #ff007f;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Tấm Thiệp Thả Thính */
        #card-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 1, 6, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 95;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            backdrop-filter: blur(10px);
        }

        #card-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .card-content {
            background: rgba(25, 10, 40, 0.92);
            border: 2px solid #ff007f;
            box-shadow: 0 0 45px rgba(255, 0, 127, 0.6), inset 0 0 20px rgba(255, 0, 127, 0.3);
            border-radius: 24px;
            padding: 35px 30px;
            text-align: center;
            width: 380px;
            max-width: 90%;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #card-modal.active .card-content {
            transform: scale(1);
        }

        .card-title {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff007f;
        }

        .poem-text {
            font-size: 14px;
            color: #f3e6ff;
            line-height: 1.7;
            margin-bottom: 20px;
            font-style: italic;
        }

        .signature {
            font-size: 18px;
            font-weight: bold;
            color: #ff66cc;
            margin-bottom: 25px;
            text-shadow: 0 0 8px #ff007f;
            font-family: 'Brush Script MT', cursive, sans-serif;
            letter-spacing: 2px;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff007f;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px #ff007f;
        }

        /* Bảng điều chỉnh màu sắc vũ trụ */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 5, 25, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 12px;
            padding: 12px;
            z-index: 10;
            width: 200px;
            backdrop-filter: blur(8px);
            font-size: 11px;
        }

        .control-group {
            margin-bottom: 8px;
        }

        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #ff85c0;
            font-weight: 600;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 26px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff007f;
        }

        /* Modal hiển thị ảnh / video khi bấm vào hành tinh trong thiên hà */
        #media-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        #media-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .media-card {
            background: rgba(20, 8, 30, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.8);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 360px;
            max-width: 90%;
            position: relative;
        }

        .media-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ff007f;
            object-fit: cover;
            margin: 0 auto 12px;
            box-shadow: 0 0 15px #ff007f;
        }

        .media-video {
            width: 100%;
            max-height: 200px;
            border-radius: 10px;
            border: 1px solid #ff007f;
            margin-bottom: 12px;
            outline: none;
            background: #000;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 1. Màn hình Hộp Quà Ban Đầu -->
    <div id="gift-screen">
        <div class="gift-box-wrapper" onclick="openGiftCard()">
            <div class="gift-icon">🎁</div>
            <div class="gift-text">Có một món quà dành cho bạn... Chạm để mở ✨</div>
        </div>
    </div>

    <!-- 2. Tấm Thiệp Thả Thính -->
    <div id="card-modal">
        <div class="card-content">
            <h2 class="card-title">Gửi Tình Yêu Của Anh 💖</h2>
            <div class="poem-text">
                "Trái đất ngoài kia dẫu rộng lớn bao la,<br>
                Nhưng thế giới của anh chỉ thu bé lại bằng em.<br>
                Chúc em tuổi mới luôn rạng ngời và hạnh phúc,<br>
                Bởi vì nụ cười của em chính là thiên hà của anh."
            </div>
            <div class="signature">— Huy —</div>
            <button class="btn-main" onclick="enterGalaxy()">VÀO KHÁM PHÁ THIÊN HÀ 🌌</button>
        </div>
    </div>

    <!-- Bảng điều khiển tùy chỉnh thiên hà -->
    <div id="control-panel" style="display: none;" id="panel-box">
        <div class="control-group">
            <label>Màu Trái Tim Trung Tâm</label>
            <input type="color" id="centerColor" value="#ff007f">
        </div>
        <div class="control-group">
            <label>Màu Hạt Thiên Hà</label>
            <input type="color" id="particleColor" value="#ff4da6">
        </div>
        <div class="control-group">
            <label>Độ Sáng Chấm Sáng</label>
            <input type="range" id="brightness" min="1" max="3" step="0.1" value="2">
        </div>
    </div>

    <!-- Modal Xem Ảnh / Video trong không gian -->
    <div id="media-modal">
        <div class="media-card">
            <span class="close-btn" onclick="closeMediaModal()">&times;</span>
            <img id="modal-img" class="media-avatar" src="./anh.jpg" alt="Media">
            <video id="modal-video" class="media-video" controls style="display: none;"></video>
            <h3 id="modal-title" style="font-size: 17px; color: #fff; margin-bottom: 8px;"></h3>
            <p id="modal-text" style="font-size: 12px; color: #d0c0e0; margin-bottom: 15px;"></p>
            <button class="btn-main" style="padding: 6px 18px; font-size: 12px;" onclick="closeMediaModal()">Đóng 💕</button>
        </div>
    </div>

    <script>
        // Dữ liệu hiển thị khi click vào các hành tinh ảnh/video xung quanh
        const wishesData = [
            {
                type: 'image',
                img: './anh.jpg',
                title: 'Bông Hồng Nhỏ Của Anh 🌹',
                text: 'Chúc em mọi điều tốt đẹp nhất sẽ đến trong ngày hôm nay và mãi về sau!'
            },
            {
                type: 'video',
                video: './video1.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 1 🎬',
                text: 'Mỗi thước phim bên em đều là ký ức tuyệt vời nhất trong cuộc đời anh.'
            },
            {
                type: 'video',
                video: './video2.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 2 💕',
                text: 'Cảm ơn em đã luôn ở cạnh, cùng anh đi qua bao năm tháng dịu dàng.'
            },
            {
                type: 'video',
                video: './video3.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 3 ✨',
                text: 'Mãi yêu em, cô gái ngốc nghếch nhưng đáng yêu nhất của anh!'
            }
        ];

        let scene, camera, renderer, controls;
        let heartMesh, galaxyParticles;
        let interactiveNodes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 1. Mở thiệp từ hộp quà
        function openGiftCard() {
            document.getElementById('gift-screen').style.opacity = '0';
            document.getElementById('gift-screen').style.visibility = 'hidden';
            document.getElementById('card-modal').classList.add('active');
        }

        // 2. Vào thiên hà 3D sau khi đọc thiệp
        function enterGalaxy() {
            document.getElementById('card-modal').classList.remove('active');
            document.getElementById('control-panel').style.display = 'block';
            init3D();
        }

        // Tạo texture hạt sáng phát quang cực mịn & nịnh mắt
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 105, 180, 0.9)');
            gradient.addColorStop(0.6, 'rgba(200, 0, 120, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020106, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 36);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMappingExposure = 2.0; // Tăng độ rực rỡ sáng
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 85;
            controls.minDistance = 10;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff007f, 4, 70);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            const particleTexture = createGlowTexture();

            createDenseGalaxy(particleTexture);
            createCenterHeart(particleTexture);
            createOrbitingNodes();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            // Bảng điều khiển tùy chỉnh màu sắc tương tác trực tiếp
            document.getElementById('centerColor').addEventListener('input', (e) => {
                if (heartMesh) heartMesh.material.color.set(e.target.value);
            });

            document.getElementById('particleColor').addEventListener('input', (e) => {
                if (galaxyParticles) galaxyParticles.material.color.set(e.target.value);
            });

            document.getElementById('brightness').addEventListener('input', (e) => {
                renderer.toneMappingExposure = parseFloat(e.target.value);
            });

            animate();
        }

        // Tạo thiên hà dày đặc vô số chấm sáng mượt mà, lấp lánh
        function createDenseGalaxy(texture) {
            const count = 12000; // Số lượng chấm sáng cực lớn
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorInside = new THREE.Color('#ff2a85');
            const colorOutside = new THREE.Color('#4b0082');

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * 32 + 2;
                const spinAngle = radius * 0.75;
                const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

                const randomX = (Math.random() - 0.5) * 2.2;
                const randomY = (Math.random() - 0.5) * 2.2;
                const randomZ = (Math.random() - 0.5) * 2.2;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone().lerp(colorOutside, radius / 32);
                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.38,
                map: texture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        // Tạo Trái tim trung tâm bằng hàng ngàn hạt sáng hồng rực
        function createCenterHeart(texture) {
            const count = 2200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const t = Math.PI * 2 * Math.random();
                const u = Math.random() * 2 - 1;

                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = u * 6;

                x *= 0.28;
                y *= 0.28;
                z *= 0.28;

                positions[i * 3] = x + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xff007f,
                size: 0.45,
                map: texture,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartMesh = new THREE.Points(geometry, material);
            heartMesh.position.y = 2.2;
            scene.add(heartMesh);
        }

        // Sắp xếp các ảnh/video xoay tròn đều đặn, gọn gàng quanh quỹ đạo
        function createOrbitingNodes() {
            const loader = new THREE.TextureLoader();
            const total = wishesData.length;
            const radius = 14;

            wishesData.forEach((item, idx) => {
                const angle = (idx / total) * Math.PI * 2;

                loader.load(item.img, (texture) => {
                    const group = new THREE.Group();

                    // Vòng viền phát sáng hành tinh
                    const ringGeo = new THREE.RingGeometry(1.6, 1.78, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff007f, side: THREE.DoubleSide });
                    group.add(new THREE.Mesh(ringGeo, ringMat));

                    // Ảnh bên trong
                    const imgGeo = new THREE.CircleGeometry(1.55, 32);
                    const imgMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                    const imgMesh = new THREE.Mesh(imgGeo, imgMat);
                    group.add(imgMesh);

                    group.position.x = Math.cos(angle) * radius;
                    group.position.z = Math.sin(angle) * radius;
                    group.position.y = (idx % 2 === 0 ? 1 : -1) * 1.5;

                    imgMesh.userData = { id: idx, ...item };
                    interactiveNodes.push(imgMesh);

                    scene.add(group);
                    item.nodeGroup = group;
                    item.angle = angle;
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxyParticles) galaxyParticles.rotation.y += 0.0012;
            
            if (heartMesh) {
                heartMesh.rotation.y += 0.004;
                const time = Date.now() * 0.003;
                heartMesh.scale.setScalar(1 + Math.sin(time) * 0.09);
            }

            // Xoay các hành tinh ảnh/video mượt mà
            const speed = 0.002;
            wishesData.forEach(item => {
                if (item.nodeGroup) {
                    item.angle += speed;
                    item.nodeGroup.position.x = Math.cos(item.angle) * 14;
                    item.nodeGroup.position.z = Math.sin(item.angle) * 14;
                    item.nodeGroup.lookAt(camera.position);
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveNodes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                showMediaModal(data);
            }
        }

        function showMediaModal(data) {
            const imgElem = document.getElementById('modal-img');
            const videoElem = document.getElementById('modal-video');

            if (data.type === 'video' && data.video) {
                imgElem.style.display = 'none';
                videoElem.style.display = 'block';
                videoElem.src = data.video;
                videoElem.play();
            } else {
                videoElem.pause();
                videoElem.style.display = 'none';
                imgElem.style.display = 'block';
                imgElem.src = data.img;
            }

            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerText = data.text;
            document.getElementById('media-modal').classList.add('active');
        }

        function closeMediaModal() {
            const videoElem = document.getElementById('modal-video');
            videoElem.pause();
            document.getElementById('media-modal').classList.remove('active');
        }
    </script>
</body>
</html>
