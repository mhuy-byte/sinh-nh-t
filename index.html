<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Galaxy - YÊU</title>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020106;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Màn hình chào mừng */
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 1, 8, 0.93);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .card-welcome {
            background: rgba(20, 8, 30, 0.88);
            border: 2px solid #ff007f;
            box-shadow: 0 0 35px #ff007f, inset 0 0 20px rgba(255, 0, 127, 0.6);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            backdrop-filter: blur(12px);
        }

        .card-welcome h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Chữ YÊU Neon siêu nổi bật */
        .glow-love {
            display: inline-block;
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff007f,
                0 0 20px #ff007f,
                0 0 40px #ff007f,
                0 0 80px #ff007f,
                0 0 100px #ff007f;
            animation: pulseLove 1.1s infinite alternate ease-in-out;
            margin: 5px 0;
        }

        @keyframes pulseLove {
            0% {
                transform: scale(1);
                text-shadow: 0 0 10px #ff007f, 0 0 25px #ff007f, 0 0 40px #ff007f;
            }
            100% {
                transform: scale(1.15);
                text-shadow: 0 0 15px #ffffff, 0 0 30px #ff66cc, 0 0 60px #ff007f, 0 0 100px #ff007f;
            }
        }

        .card-welcome p {
            font-size: 14px;
            color: #e2cef5;
            margin-bottom: 25px;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff007f;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #ff007f;
        }

        /* Bảng điều khiển */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 5, 25, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.5);
            border-radius: 14px;
            padding: 15px;
            z-index: 10;
            width: 220px;
            backdrop-filter: blur(8px);
            font-size: 12px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #ff85c0;
            font-weight: 600;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff007f;
        }

        /* Pop-up Lời chúc & Video */
        #wish-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #wish-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .wish-card {
            background: rgba(20, 8, 30, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.8);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            width: 380px;
            max-width: 90%;
            backdrop-filter: blur(15px);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        #wish-modal.active .wish-card {
            transform: scale(1);
        }

        .wish-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff007f;
            object-fit: cover;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px #ff007f;
        }

        .wish-video {
            width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid #ff007f;
            margin-bottom: 15px;
            outline: none;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            background: #000;
        }

        .wish-title {
            font-size: 19px;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff007f;
        }

        .wish-text {
            font-size: 13px;
            color: #d8c0eb;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Màn hình chào mừng -->
    <div id="welcome-screen">
        <div class="card-welcome">
            <h1>HAPPY BIRTHDAY <br><span class="glow-love">YÊU</span> ❤️</h1>
            <p>Nhấp nút bên dưới để khám phá vũ trụ quà tặng ✨</p>
            <button class="btn-main" onclick="startExperience()">KHÁM PHÁ VŨ TRỤ ✨</button>
        </div>
    </div>

    <!-- Bảng điều chỉnh màu -->
    <div id="control-panel">
        <div class="control-group">
            <label>Màu Trái Tim Trung Tâm</label>
            <input type="color" id="centerColor" value="#ff007f">
        </div>
        <div class="control-group">
            <label>Màu Dải Ngân Hà</label>
            <input type="color" id="particleColor" value="#ff33aa">
        </div>
        <div class="control-group">
            <label>Độ Sáng Vũ Trụ</label>
            <input type="range" id="brightness" min="0.8" max="2.5" step="0.1" value="1.5">
        </div>
    </div>

    <!-- Pop-up Lời chúc & Video -->
    <div id="wish-modal">
        <div class="wish-card">
            <span class="close-btn" onclick="closeWish()">&times;</span>
            
            <img id="modal-img" class="wish-avatar" src="./anh.jpg" alt="Avatar">
            <video id="modal-video" class="wish-video" controls style="display: none;"></video>
            
            <h3 id="modal-title" class="wish-title"></h3>
            <p id="modal-text" class="wish-text"></p>
            <button class="btn-main" style="padding: 8px 22px; font-size: 13px;" onclick="closeWish()">Gửi Ngàn Nụ Hôn 💋</button>
        </div>
    </div>

    <script>
        // Danh sách nội dung được chia đều khoảng cách, không bị chồng lộn xộn
        const wishesData = [
            {
                type: 'image',
                img: './anh.jpg',
                title: 'Gửi Em - Người Anh Yêu 💖',
                text: 'Chúc em tuổi mới luôn xinh đẹp, rạng rỡ và tràn ngập niềm vui mỗi ngày bên anh!'
            },
            {
                type: 'video',
                video: './video1.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 1 🎬',
                text: 'Bấm phát video để xem lại kỷ niệm siêu dễ thương của tụi mình nhé!'
            },
            {
                type: 'video',
                video: './video2.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 2 💕',
                text: 'Cảm ơn em vì đã luôn mang đến nụ cười và năng lượng tích cực cho anh!'
            },
            {
                type: 'video',
                video: './video3.mp4',
                img: './anh.jpg',
                title: 'Khoảnh Khắc Đáng Yêu 3 ✨',
                text: 'Mãi yêu em và chúc em một tuổi mới trọn vẹn hạnh phúc!'
            }
        ];

        let scene, camera, renderer, controls;
        let heartMesh, galaxyParticles;
        let interactiveNodes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Tạo Texture hạt sáng tròn mịn lấp lánh
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 100, 200, 0.8)');
            gradient.addColorStop(0.7, 'rgba(200, 0, 150, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020106, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 38);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMappingExposure = 1.5;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 90;
            controls.minDistance = 12;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff007f, 3, 60);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            const particleTexture = createGlowTexture();

            createGalaxy(particleTexture);
            createCenterHeart(particleTexture);
            createSpacedAvatars();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            document.getElementById('centerColor').addEventListener('input', (e) => {
                if (heartMesh) heartMesh.material.color.set(e.target.value);
            });

            document.getElementById('particleColor').addEventListener('input', (e) => {
                if (galaxyParticles) galaxyParticles.material.color.set(e.target.value);
            });

            document.getElementById('brightness').addEventListener('input', (e) => {
                renderer.toneMappingExposure = parseFloat(e.target.value);
            });

            animate();
        }

        // Tạo dải ngân hà với các chấm sáng rực rỡ & nổi bật
        function createGalaxy(texture) {
            const count = 7500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorInside = new THREE.Color('#ff00aa');
            const colorOutside = new THREE.Color('#5500aa');

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * 28 + 3;
                const spinAngle = radius * 0.7;
                const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

                const randomX = (Math.random() - 0.5) * 1.8;
                const randomY = (Math.random() - 0.5) * 1.8;
                const randomZ = (Math.random() - 0.5) * 1.8;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone().lerp(colorOutside, radius / 28);
                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.45,
                map: texture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        // Tạo Trái tim hạt sáng 3D trung tâm
        function createCenterHeart(texture) {
            const count = 1800;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const t = Math.PI * 2 * Math.random();
                const u = Math.random() * 2 - 1;

                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = u * 6;

                x *= 0.28;
                y *= 0.28;
                z *= 0.28;

                positions[i * 3] = x + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xff007f,
                size: 0.5,
                map: texture,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartMesh = new THREE.Points(geometry, material);
            heartMesh.position.y = 2.5;
            scene.add(heartMesh);
        }

        // Sắp xếp các hình ảnh/video ngăn nắp, cách đều nhau trên quỹ đạo
        function createSpacedAvatars() {
            const loader = new THREE.TextureLoader();
            const total = wishesData.length;
            const radius = 15; // Bán kính quỹ đạo xoay

            wishesData.forEach((item, idx) => {
                // Tách đều góc quay để không bị dính vào nhau
                const angle = (idx / total) * Math.PI * 2;

                loader.load(item.img, (texture) => {
                    const group = new THREE.Group();

                    // Khung viền tròn phát sáng
                    const ringGeo = new THREE.RingGeometry(1.65, 1.8, 32);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0xff007f,
                        side: THREE.DoubleSide
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    group.add(ringMesh);

                    // Ảnh tròn bên trong
                    const imgGeo = new THREE.CircleGeometry(1.6, 32);
                    const imgMat = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.DoubleSide
                    });
                    const imgMesh = new THREE.Mesh(imgGeo, imgMat);
                    group.add(imgMesh);

                    // Đặt vị trí phân bổ đều
                    group.position.x = Math.cos(angle) * radius;
                    group.position.z = Math.sin(angle) * radius;
                    group.position.y = (idx % 2 === 0 ? 1 : -1) * 1.5; // Đổi độ cao so le để không bị khuất

                    imgMesh.userData = { id: idx, ...item };
                    interactiveNodes.push(imgMesh);

                    scene.add(group);
                    
                    // Lưu lại tham chiếu để xoay tròn theo thời gian
                    item.nodeGroup = group;
                    item.angle = angle;
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Xoay dải ngân hà
            if (galaxyParticles) galaxyParticles.rotation.y += 0.0012;
            
            // Trái tim trung tâm nhịp đập
            if (heartMesh) {
                heartMesh.rotation.y += 0.004;
                const time = Date.now() * 0.003;
                heartMesh.scale.setScalar(1 + Math.sin(time) * 0.1);
            }

            // Quay các ảnh/video theo quỹ đạo hình tròn ngắn gọn, ngăn nắp
            const speed = 0.002;
            wishesData.forEach(item => {
                if (item.nodeGroup) {
                    item.angle += speed;
                    item.nodeGroup.position.x = Math.cos(item.angle) * 15;
                    item.nodeGroup.position.z = Math.sin(item.angle) * 15;
                    item.nodeGroup.lookAt(camera.position); // Luôn hướng về góc nhìn người dùng
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveNodes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                showWish(data);
            }
        }

        function startExperience() {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            welcome.style.visibility = 'hidden';
            init3D();
        }

        function showWish(data) {
            const imgElem = document.getElementById('modal-img');
            const videoElem = document.getElementById('modal-video');

            if (data.type === 'video' && data.video) {
                imgElem.style.display = 'none';
                videoElem.style.display = 'block';
                videoElem.src = data.video;
                videoElem.play();
            } else {
                videoElem.pause();
                videoElem.style.display = 'none';
                imgElem.style.display = 'block';
                imgElem.src = data.img;
            }

            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerText = data.text;
            document.getElementById('wish-modal').classList.add('active');
        }

        function closeWish() {
            const videoElem = document.getElementById('modal-video');
            videoElem.pause();
            document.getElementById('wish-modal').classList.remove('active');
        }
    </script>
</body>
</html>
