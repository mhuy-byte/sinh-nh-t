<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Galaxy - Minh Huy</title>
    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020106;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Hiệu ứng trái tim bay nền nhẹ nhàng */
        .bg-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 0, 127, 0.6);
            animation: riseHeart 6s infinite ease-in;
            font-size: 20px;
        }

        @keyframes riseHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.4); opacity: 0; }
        }

        /* Sao băng xẹt qua */
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,0,127,0));
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: shoot 3s linear infinite;
        }

        @keyframes shoot {
            0% { transform: rotate(315deg) translateX(0); opacity: 1; }
            100% { transform: rotate(315deg) translateX(-1000px); opacity: 0; }
        }

        /* Màn hình Hộp Quà Ban Đầu */
        #gift-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #220a3a 0%, #05010a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .gift-container {
            text-align: center;
            cursor: pointer;
            animation: floatGift 3s infinite ease-in-out;
        }

        .gift-box {
            font-size: 110px;
            filter: drop-shadow(0 0 35px rgba(255, 0, 127, 0.9));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-container:hover .gift-box {
            transform: scale(1.2) rotate(6deg);
        }

        .gift-instruction {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff66cc, #ffffff, #ff3399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            letter-spacing: 1.5px;
            animation: pulseText 2s infinite alternate;
            padding: 0 15px;
        }

        /* Tấm Thiệp Sang Trọng */
        #card-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 1, 6, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 95;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            backdrop-filter: blur(12px);
        }

        #card-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .card-box {
            background: linear-gradient(145deg, rgba(35, 12, 55, 0.95), rgba(15, 5, 25, 0.98));
            border: 2px solid #ff007f;
            box-shadow: 0 0 55px rgba(255, 0, 127, 0.75), inset 0 0 25px rgba(255, 0, 127, 0.4);
            border-radius: 28px;
            padding: 35px 30px;
            text-align: center;
            width: 460px;
            max-width: 92%;
            position: relative;
            transform: scale(0.7) translateY(30px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #card-modal.active .card-box {
            transform: scale(1) translateY(0);
        }

        .sender-tag {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff85c0;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .card-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 0 12px #ff007f;
        }

        /* Hiệu ứng gõ chữ */
        .wishes-content {
            font-size: 14px;
            color: #f3e6ff;
            line-height: 1.7;
            margin-bottom: 20px;
            font-style: italic;
            text-align: center;
            min-height: 90px;
        }

        /* Bộ đếm thời gian yêu nhau */
        .love-timer {
            font-size: 12px;
            color: #ff99dd;
            background: rgba(255, 0, 127, 0.15);
            border: 1px dashed rgba(255, 0, 127, 0.4);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .signature-name {
            font-size: 20px;
            font-weight: bold;
            color: #ff66cc;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #ff007f;
            font-family: 'Brush Script MT', cursive, sans-serif;
            letter-spacing: 2px;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff007f;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #ff007f;
        }

        /* Nút Bật/Tắt Nhạc Nền */
        #music-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(25, 10, 40, 0.85);
            border: 1px solid #ff007f;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            font-size: 18px;
            transition: transform 0.2s;
        }
        #music-toggle:hover {
            transform: scale(1.1);
        }

        /* Bảng tùy chỉnh màu thiên hà */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 5, 25, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 12px;
            padding: 12px;
            z-index: 10;
            width: 190px;
            backdrop-filter: blur(8px);
            font-size: 11px;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .control-group {
            margin-bottom: 8px;
        }

        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #ff85c0;
            font-weight: 600;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff007f;
        }

        /* Modal Xem Ảnh & Lời Chúc Chi Tiết */
        #media-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }

        #media-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .media-card {
            background: rgba(22, 8, 38, 0.96);
            border: 2px solid #ff007f;
            box-shadow: 0 0 45px rgba(255, 0, 127, 0.8);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            width: 380px;
            max-width: 90%;
            position: relative;
        }

        .media-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #ff007f;
            object-fit: cover;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px #ff007f;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes pulseText {
            0% { opacity: 0.8; text-shadow: 0 0 10px rgba(255,0,127,0.5); }
            100% { opacity: 1; text-shadow: 0 0 25px rgba(255,0,127,1); }
        }
    </style>
</head>
<body>

    <!-- Nền trái tim bay sinh động -->
    <div class="bg-hearts" id="bgHearts"></div>

    <!-- Nhạc nền ẩn (có thể đổi link mp3 tùy ý) -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3?filename=romantic-lofi-112152.mp3" type="audio/mpeg">
    </audio>

    <!-- Nút Bật/Tắt Âm Thanh -->
    <div id="music-toggle" onclick="toggleMusic()" title="Bật/Tắt Nhạc">🎵</div>

    <div id="canvas-container"></div>

    <!-- 1. Màn hình Hộp Quà Ban Đầu -->
    <div id="gift-screen">
        <div class="gift-container" onclick="openGiftCard()">
            <div class="gift-box">🎁</div>
            <div class="gift-instruction">✨ Chạm để mở món quà đặc biệt từ Minh Huy ✨</div>
        </div>
    </div>

    <!-- 2. Tấm Thiệp Ngọt Ngào & Sâu Sắc -->
    <div id="card-modal">
        <div class="card-box">
            <div class="sender-tag">⭐ Minh Huy Gửi Đến Bạn ⭐</div>
            <h2 class="card-title">Chúc Mừng Sinh Nhật 💖</h2>
            
            <div class="wishes-content" id="typewriterText"></div>

            <div class="love-timer" id="loveTimer">Đang tính toán khoảnh khắc tuyệt vời...</div>

            <div class="signature-name">Minh Huy</div>
            <button class="btn-main" onclick="enterGalaxy()">KHÁM PHÁ VŨ TRỤ 🌌</button>
        </div>
    </div>

    <!-- Bảng tùy chỉnh màu thiên hà -->
    <div id="control-panel">
        <div class="control-group">
            <label>Màu Trái Tim Trung Tâm</label>
            <input type="color" id="centerColor" value="#ff007f">
        </div>
        <div class="control-group">
            <label>Màu Hạt Thiên Hà</label>
            <input type="color" id="particleColor" value="#ff33aa">
        </div>
        <div class="control-group">
            <label>Độ Sáng Chấm Sáng</label>
            <input type="range" id="brightness" min="1" max="3" step="0.1" value="2.2">
        </div>
    </div>

    <!-- Modal Xem Ảnh & Lời Chúc Chi Tiết -->
    <div id="media-modal">
        <div class="media-card">
            <span class="close-btn" onclick="closeMediaModal()">&times;</span>
            <img id="modal-img" class="media-avatar" src="" alt="Ảnh kỷ niệm">
            <h3 id="modal-title" style="font-size: 18px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 8px #ff007f;"></h3>
            <p id="modal-text" style="font-size: 13px; color: #e2cef5; line-height: 1.6; margin-bottom: 20px;"></p>
            <button class="btn-main" style="padding: 8px 24px; font-size: 13px;" onclick="closeMediaModal()">Yêu Lắm 💕</button>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng trái tim bay nền ngẫu nhiên
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = ['💖', '✨', '🌸', '💫', '❤️'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('bgHearts').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 400);

        // Tạo sao băng bay ngẫu nhiên
        setInterval(() => {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.top = Math.random() * 50 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.width = (Math.random() * 80 + 60) + 'px';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 3000);
        }, 2000);

        // Điều khiển nhạc nền
        let isMusicPlaying = false;
        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            const btn = document.getElementById('music-toggle');
            if (isMusicPlaying) {
                audio.pause();
                btn.innerHTML = '🎵';
                btn.style.boxShadow = '0 0 15px rgba(255, 0, 127, 0.5)';
            } else {
                audio.play();
                btn.innerHTML = '🔊';
                btn.style.boxShadow = '0 0 25px rgba(0, 255, 127, 0.8)';
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // Nội dung lời chúc gõ chữ tự động
        const messageText = "Trái đất quay quanh mặt trời, còn thế giới của mình chỉ mong quanh quẩn bên nụ cười của bạn.\n\nChúc bạn tuổi mới luôn rực rỡ như những vì sao, an yên như dải ngân hà và mỗi ngày trôi qua đều tràn ngập niềm vui!";
        let charIndex = 0;

        function startTypewriter() {
            const target = document.getElementById('typewriterText');
            target.innerHTML = "";
            charIndex = 0;
            function type() {
                if (charIndex < messageText.length) {
                    target.innerHTML += messageText.charAt(charIndex) === '\n' ? '<br>' : messageText.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 35);
                }
            }
            type();
        }

        // Bộ đếm thời gian (tính từ ngày bắt đầu mốc kỷ niệm tùy chọn)
        function updateLoveTimer() {
            const startDate = new Date('2026-09-20T00:00:00'); // Bạn có thể đổi ngày tùy ý
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            
            document.getElementById('loveTimer').innerHTML = `⏳ Đã đồng hành cùng nhau: <b>${days} ngày ${hours} giờ ${minutes} phút</b> ✨`;
        }
        setInterval(updateLoveTimer, 1000);

        const wishesData = [
            {
                img: './anh.jpg',
                title: 'Nụ Cười Tỏa Sáng ✨',
                text: 'Mong rằng nụ cười này sẽ luôn nở trên môi bạn mỗi ngày. Chúc bạn tuổi mới luôn gặp nhiều may mắn và thành công rực rỡ!'
            },
            {
                img: './anh1.jpg',
                title: 'Khoảnh Khắc Ngọt Ngào 🌸',
                text: 'Cảm ơn vì đã xuất hiện và mang đến thật nhiều năng lượng tích cực. Chúc mọi điều ước của bạn trong tuổi mới đều trở thành hiện thực!'
            },
            {
                img: './anh2.jpg',
                title: 'Bình An & Hạnh Phúc 💖',
                text: 'Chúc bạn bước sang tuổi mới với một trái tim kiên cường, một tinh thần rạng ngời và luôn có bình an ở bên cạnh.'
            },
            {
                img: './anh3.jpg',
                title: 'Tựa Như Những Vì Sao 🌟',
                text: 'Bạn rất đặc biệt và xứng đáng nhận được những điều tuyệt vời nhất trên đời này. Mãi rực rỡ như thế nhé!'
            }
        ];

        let scene, camera, renderer, controls;
        let heartMesh, galaxyParticles;
        let interactiveNodes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function openGiftCard() {
            document.getElementById('gift-screen').style.opacity = '0';
            document.getElementById('gift-screen').style.visibility = 'hidden';
            document.getElementById('card-modal').classList.add('active');
            
            // Tự động bật nhạc nền khi mở quà nếu chưa bật
            if (!isMusicPlaying) {
                document.getElementById('bgMusic').play().catch(() => {});
                document.getElementById('music-toggle').innerHTML = '🔊';
                isMusicPlaying = true;
            }

            startTypewriter();
            updateLoveTimer();
        }

        let isFlyingIntoGalaxy = false;
        let flyProgress = 0;

        function enterGalaxy() {
            document.getElementById('card-modal').style.opacity = '0';
            document.getElementById('card-modal').style.visibility = 'hidden';
            
            init3DScene();

            isFlyingIntoGalaxy = true;
            flyProgress = 0;

            setTimeout(() => {
                const panel = document.getElementById('control-panel');
                panel.style.display = 'block';
                panel.style.opacity = '1';
            }, 1800);
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 105, 180, 0.95)');
            gradient.addColorStop(0.6, 'rgba(210, 0, 130, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function init3DScene() {
            if (renderer) return;

            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020106, 0.01);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 120, 260);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMappingExposure = 2.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 100;
            controls.minDistance = 12;
            controls.enabled = false;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff007f, 5, 80);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            const particleTexture = createGlowTexture();

            createMassiveGalaxy(particleTexture);
            createCenterHeart(particleTexture);
            createOrbitingPhotos();

            window.addEventListener('resize', onWindowResize);

            // Xử lý chạm trên điện thoại & click trên máy tính
            let pointerDownX = 0;
            let pointerDownY = 0;

            window.addEventListener('pointerdown', (e) => {
                pointerDownX = e.clientX;
                pointerDownY = e.clientY;
            });

            window.addEventListener('pointerup', (e) => {
                if (!controls.enabled) return;

                const moveX = Math.abs(e.clientX - pointerDownX);
                const moveY = Math.abs(e.clientY - pointerDownY);

                if (moveX < 10 && moveY < 10) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactiveNodes);

                    if (intersects.length > 0) {
                        const data = intersects[0].object.userData;
                        showMediaModal(data);
                    }
                }
            });

            document.getElementById('centerColor').addEventListener('input', (e) => {
                if (heartMesh) heartMesh.material.color.set(e.target.value);
            });

            document.getElementById('particleColor').addEventListener('input', (e) => {
                if (galaxyParticles) galaxyParticles.material.color.set(e.target.value);
            });

            document.getElementById('brightness').addEventListener('input', (e) => {
                renderer.toneMappingExposure = parseFloat(e.target.value);
            });

            animate();
        }

        function createMassiveGalaxy(texture) {
            const count = 18000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorInside = new THREE.Color('#ff1a8c');
            const colorOutside = new THREE.Color('#4a0080');

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * 40 + 3;
                const spinAngle = radius * 0.7;
                const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

                const randomX = (Math.random() - 0.5) * 2.5;
                const randomY = (Math.random() - 0.5) * 2.5;
                const randomZ = (Math.random() - 0.5) * 2.5;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone().lerp(colorOutside, radius / 40);
                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.42,
                map: texture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createCenterHeart(texture) {
            const count = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const t = Math.PI * 2 * Math.random();
                const u = Math.random() * 2 - 1;

                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = u * 6;

                x *= 0.3;
                y *= 0.3;
                z *= 0.3;

                positions[i * 3] = x + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.2;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xff007f,
                size: 0.48,
                map: texture,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartMesh = new THREE.Points(geometry, material);
            heartMesh.position.y = 2.5;
            scene.add(heartMesh);
        }

        function createOrbitingPhotos() {
            const loader = new THREE.TextureLoader();
            const total = wishesData.length;
            const radius = 16;

            wishesData.forEach((item, idx) => {
                const angle = (idx / total) * Math.PI * 2;

                loader.load(item.img, (texture) => {
                    const group = new THREE.Group();

                    const ringGeo = new THREE.RingGeometry(1.8, 2.0, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff007f, side: THREE.DoubleSide });
                    group.add(new THREE.Mesh(ringGeo, ringMat));

                    const imgGeo = new THREE.CircleGeometry(1.75, 32);
                    const imgMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                    const imgMesh = new THREE.Mesh(imgGeo, imgMat);
                    group.add(imgMesh);

                    group.position.x = Math.cos(angle) * radius;
                    group.position.z = Math.sin(angle) * radius;
                    group.position.y = (idx % 2 === 0 ? 1.5 : -1.5);

                    imgMesh.userData = { ...item };
                    interactiveNodes.push(imgMesh);

                    scene.add(group);
                    item.nodeGroup = group;
                    item.angle = angle;
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isFlyingIntoGalaxy) {
                flyProgress += 0.012;
                if (flyProgress >= 1) {
                    flyProgress = 1;
                    isFlyingIntoGalaxy = false;
                    controls.enabled = true;
                }
                const easeProgress = 1 - Math.pow(1 - flyProgress, 3);
                camera.position.x = 0;
                camera.position.y = 120 + (18 - 120) * easeProgress;
                camera.position.z = 260 + (42 - 260) * easeProgress;
                camera.lookAt(0, 2, 0);
            }

            if (galaxyParticles) galaxyParticles.rotation.y += 0.001;
            
            if (heartMesh) {
                heartMesh.rotation.y += 0.004;
                const time = Date.now() * 0.003;
                heartMesh.scale.setScalar(1 + Math.sin(time) * 0.09);
            }

            const speed = 0.0018;
            wishesData.forEach(item => {
                if (item.nodeGroup) {
                    item.angle += speed;
                    item.nodeGroup.position.x = Math.cos(item.angle) * 16;
                    item.nodeGroup.position.z = Math.sin(item.angle) * 16;
                    item.nodeGroup.lookAt(camera.position);
                }
            });

            if (controls && controls.enabled) {
                controls.update();
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showMediaModal(data) {
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerText = data.text;
            document.getElementById('media-modal').classList.add('active');
        }

        function closeMediaModal() {
            document.getElementById('media-modal').classList.remove('active');
        }
    </script>
</body>
</html>
